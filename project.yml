name: EdiMarp
options:
  bundleIdPrefix: com.doldam0
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
packages:
  EdiCore:
    path: Packages/EdiCore
targets:
  EdiMarp:
    type: application
    platform: macOS
    sources:
      - path: EdiMarp
    dependencies:
      - package: EdiCore
    info:
      path: EdiMarp/Info.plist
      properties:
        CFBundleName: EdiMarp
        CFBundleDisplayName: EdiMarp
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 doldam0"
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Deck
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
    entitlements:
      path: EdiMarp/EdiMarp.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.print: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doldam0.EdiMarp
        # Release builds override these from the git tag (scripts/make-dmg.sh).
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
